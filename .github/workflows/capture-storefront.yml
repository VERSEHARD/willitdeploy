name: Capture Grown Brilliance Public Storefront

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-storefront.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Capture public storefront
        env:
          AUTO_START: "0"
          FORCE_RECRAWL: "1"
          TARGET_URL: "https://www.grownbrilliance.com/"
          DATA_DIR: "${{ github.workspace }}/capture-output"
          MAX_PAGES: "5000"
          MAX_ASSETS: "15000"
          PAGE_WORKERS: "12"
          ASSET_WORKERS: "16"
          REQUEST_TIMEOUT: "20"
        run: |
          python - <<'PY'
          import app
          app.do_crawl(force=True)
          print(app.snapshot_state())
          if app.snapshot_state().get("status") != "complete":
              raise SystemExit("Capture did not complete")
          PY

      - name: Upload capture ZIP
        uses: actions/upload-artifact@v4
        with:
          name: grown-brilliance-public
          path: capture-output/grown-brilliance-public.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
