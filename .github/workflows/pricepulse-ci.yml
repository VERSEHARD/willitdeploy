name: PricePulse CI

on:
  push:
    branches: [main]
    paths:
      - "monitor/**"
      - "app.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/pricepulse-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATA_DIR: /tmp/pricepulse-ci
      MONITOR_TOKEN: ""
      CHECK_TICK_SECONDS: "60"
      ENABLE_BACKGROUND: "0"
      SEED_DEMO: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q app.py scanner.py monitor

      - name: PricePulse deterministic functional tests
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          data = Path(os.environ["DATA_DIR"])
          shutil.rmtree(data, ignore_errors=True)
          data.mkdir(parents=True, exist_ok=True)

          import monitor.app as pp

          html_1 = """
          <html><head><script type="application/ld+json">
          {"@context":"https://schema.org","@type":"Product","offers":{"@type":"Offer","price":"51.77","priceCurrency":"GBP","availability":"https://schema.org/InStock"}}
          </script></head><body>
            <div class="product_main">
              <p class="price_color">£51.77</p>
              <p class="availability">In stock</p>
            </div>
          </body></html>
          """
          html_2 = """
          <html><head><script type="application/ld+json">
          {"@context":"https://schema.org","@type":"Product","offers":{"@type":"Offer","price":"49.99","priceCurrency":"GBP","availability":"https://schema.org/InStock"}}
          </script></head><body>
            <div class="product_main">
              <p class="price_color">£49.99</p>
              <p class="availability">In stock</p>
              <p>Sale</p>
            </div>
          </body></html>
          """

          current = {"html": html_1}
          pp.fetch_page = lambda url: (200, url, current["html"])

          client = pp.app.test_client()
          health = client.get("/health")
          assert health.status_code == 200, health.data
          assert health.get_json()["version"] == pp.APP_VERSION

          landing = client.get("/", headers={"X-PricePulse-Self-Test":"1"})
          workspace = client.get("/app")
          assert landing.status_code == 200
          assert workspace.status_code == 200
          assert "Stop checking the same page over and over" in landing.get_data(as_text=True)
          assert "Everything you asked PricePulse to watch" in workspace.get_data(as_text=True)

          probe = client.post("/api/probe", json={"url":"https://example.com/product"})
          assert probe.status_code == 200, probe.data
          probe_json = probe.get_json()
          assert probe_json["price"] == 51.77
          assert probe_json["currency"] == "GBP"
          assert probe_json["availability"] == "InStock"

          created = client.post("/api/monitors", json={
              "name": "Fixture product",
              "url": "https://example.com/product",
              "kind": "price",
              "selector": ".product_main",
              "must_contain": "In stock",
              "price_regex": r"£([0-9.]+)",
              "max_price": 60,
              "interval_min": 60,
          })
          assert created.status_code == 201, created.data
          monitor_id = created.get_json()["id"]

          first = client.post(f"/api/monitors/{monitor_id}/run")
          assert first.status_code == 200, first.data
          first_json = first.get_json()
          assert first_json["ok"] is True
          assert abs(first_json["price"] - 51.77) < 0.001
          assert "price_threshold" in first_json["events"]

          second = client.post(f"/api/monitors/{monitor_id}/run")
          assert second.get_json()["events"] == []

          current["html"] = html_2
          third = client.post(f"/api/monitors/{monitor_id}/run")
          third_json = third.get_json()
          assert third_json["changed"] is True
          assert "content_changed" in third_json["events"]
          assert "price_changed" in third_json["events"]
          assert abs(third_json["price"] - 49.99) < 0.001

          history = client.get(f"/api/monitors/{monitor_id}/history")
          assert history.status_code == 200
          assert len(history.get_json()["snapshots"]) == 3

          stats = client.get("/api/stats").get_json()
          assert stats["checks_total"] >= 3
          assert stats["success_rate"] == 100.0

          report = client.get("/api/report?days=7").get_json()
          assert report["total_signals"] >= 2

          rejected = client.post("/api/monitors", json={
              "name": "bad",
              "url": "http://127.0.0.1:8080/admin"
          })
          assert rejected.status_code == 400
          assert "Private/local" in rejected.get_json()["error"]

          print("deterministic functional tests: PASS")
          PY

      - name: Mounted WSGI routes and UI contract
        run: |
          python - <<'PY'
          from werkzeug.test import Client
          from werkzeug.wrappers import Response
          import app as root
          import monitor.app as pp

          c = Client(root.application, Response)
          health = c.get("/pricepulse/health")
          assert health.status_code == 200
          assert health.get_json()["version"] == pp.APP_VERSION

          landing = c.get("/pricepulse/")
          workspace = c.get("/pricepulse/app")
          assert landing.status_code == 200
          assert workspace.status_code == 200
          assert "PricePulse" in landing.get_data(as_text=True)
          assert "Reliability lab" in workspace.get_data(as_text=True)

          assert pp.audit_css_contract() is True
          pp.audit_rendered_ui(pp.app.test_client().get("/", headers={"X-PricePulse-Self-Test":"1"}), "landing")
          pp.audit_rendered_ui(pp.app.test_client().get("/app"), "workspace")
          print("mounted routes + UI contract: PASS")
          PY

      - name: Real public-page smoke tests
        run: |
          python - <<'PY'
          import monitor.app as pp

          targets = [
              ("https://linear.app/pricing", "Business"),
              ("https://github.com/pricing", "Enterprise"),
              ("https://uptimerobot.com/pricing/", "Solo"),
          ]
          for url, signal in targets:
              status, final_url, html = pp.fetch_page(url)
              text = pp.extract_content(html, None)
              assert status == 200, (url, status)
              assert signal.lower() in text.lower(), (url, signal)
              print("live fetch PASS", status, signal, final_url)
          PY
