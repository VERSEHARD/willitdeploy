name: "$1 npm 11 repair request"
description: "Request a verified package-lock repair when npm 10 passes but npm 11 fails."
title: "[Repair] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying the WillItDeploy launch experiment.

        We reproduce the npm 10.9.9 pass / npm 11.19.0 failure, refresh only package-lock.json with lifecycle scripts disabled, and verify the result under both versions. A simple refresh that does not fix the failure is rejected. The $1 charge applies only to a verified patch.
  - type: input
    id: repo
    attributes:
      label: Public GitHub repository
      description: Paste the public repository URL.
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: Branch
      placeholder: main
  - type: input
    id: path
    attributes:
      label: Project path
      description: Leave blank for repository root.
      placeholder: apps/web
  - type: textarea
    id: error
    attributes:
      label: Current npm error
      description: Paste only the relevant error lines.
      render: shell
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: 22.x / 24.x / 26.x
  - type: input
    id: npm
    attributes:
      label: npm version
      placeholder: 11.x
  - type: checkboxes
    id: consent
    attributes:
      label: Verification
      options:
        - label: I understand this request is for a public repository. I pay $1 only for a package-lock.json-only patch verified under both npm 10.9.9 and npm 11.19.0; otherwise there is no charge.
          required: true
